name: CI

on:
  push:
  pull_request:
  schedule:
    # Nightly: every test in full (a push runs the heavy module suites only for the grades it changed).
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # ci-test.mjs diffs against the commit before the push.
          fetch-depth: 0

      # Uses the pnpm version pinned in package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      # Every cheap suite in full; the modules and sampling suites for the grades this push changed
      # (scripts/ci-test.mjs), or for every page on the nightly run and on a pull request.
      - name: Test
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            node scripts/ci-test.mjs --since "${{ github.event.before }}"
          else
            node scripts/ci-test.mjs --full
          fi

      - name: Web build
        run: pnpm build:web

      # Every page's content must be in the pre-rendered HTML (crawlers and no-JS readers).
      - name: Verify pre-rendered pages
        run: pnpm verify:ssr
